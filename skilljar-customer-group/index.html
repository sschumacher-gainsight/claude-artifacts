<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skilljar · Customer Group</title>
<style>
  :root {
    --bg: #0f1729;
    --card: #1a2540;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --text: #eaf0ff;
    --muted: #93a2c4;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2a4d 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 640px; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .group-title { display: flex; align-items: center; gap: 14px; }
  .group-title h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .group-title .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(79, 140, 255, 0.3);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f8cff, #7b5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .avatar {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2dd4bf, #4f8cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #0f1729;
    flex-shrink: 0;
  }
  .member-info { min-width: 0; flex: 1; }
  .member-info .name { font-size: 17px; font-weight: 600; }
  .member-info .name .unnamed { color: var(--muted); font-style: italic; font-weight: 400; }
  .member-info .email {
    color: var(--accent);
    font-size: 14px;
    margin-top: 3px;
    word-break: break-all;
  }
  .member-info .uid {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .meta {
    display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap;
  }
  .chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .chip strong { color: var(--text); font-weight: 600; }
  .footer {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="group-title">
        <div class="icon">👥</div>
        <div>
          <h1>Customer</h1>
          <div class="sub">Skilljar user group</div>
        </div>
      </div>
      <div class="badge">1 member</div>
    </div>

    <div class="card">
      <div class="avatar">S</div>
      <div class="member-info">
        <div class="name"><span class="unnamed">No name set</span></div>
        <div class="email">spencer.schumacher+test123@skilljar.com</div>
        <div class="uid">User ID · 3q56f2bitmgqo</div>
      </div>
    </div>

    <div class="meta">
      <div class="chip">Group ID · <strong>5sq5y7ea89jd</strong></div>
      <div class="chip">Members · <strong>1</strong></div>
    </div>

    <div class="footer">Generated from Skilljar · 2026-07-14</div>
  </div>
</body>
</html>
